site_name: Recipe collection
site_url: https://tbowden.github.io


theme:
  name: material
  palette:
    - media: "(prefers-color-scheme light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - search.suggest

nav:
  - Home: index.md
  - Bread:
    - Focaccia: bread/focaccia.md


markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
